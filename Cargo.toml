[package]
name = "cipherterm"
version = "0.1.0"
edition = "2021"
description = "Terminal-styled desktop app for layering classic ciphers and encodings"

[dependencies]
eframe = { version = "0.29", features = ["persistence"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
